<script>
var META = {"v":1,"iter":310000,"salt":"neealRlRvYqtzyL9aIA2sw==","iv":"9IJLODRhrJ6ZpFmu"};
var k = document.getElementById('k'),
    b = document.getElementById('b'),
    msg = document.getElementById('msg');

function b64(s){
  var raw = atob(s), a = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
  return a;
}

async function open_(){
  var pw = k.value;
  if (!pw) { msg.textContent = '合言葉を入れてください'; return; }
  b.disabled = true; msg.textContent = '復号しています…';
  try {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(META.salt), iterations:META.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var data = b64(document.getElementById('payload').textContent.trim());
    var out = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(META.iv) }, key, data);
    var html = new TextDecoder().decode(out);
    document.open(); document.write(html); document.close();
  } catch (e) {
    // 鍵が違うと認証タグの検証で必ず失敗する（部分的に読めることはない）
    msg.textContent = '合言葉が違います。';
    b.disabled = false;
  }
}
b.onclick = open_;
k.onkeydown = function(ev){ if (ev.key === 'Enter') open_(); };
k.focus();
</script>
